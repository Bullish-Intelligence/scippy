[workspace]
resolver = "3"
members = [
    "crates/scippy-core",
    "crates/scippy-cli",
    "languages/python",
    "languages/typescript",
]
default-members = [
    "crates/scippy-core",
    "crates/scippy-cli",
    "languages/python",
    "languages/typescript",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
protobuf = "3"
scip = "0.10.0"
tempfile = "3"
