[workspace]
resolver = "3"
members = [
    "crates/scippy-core",
    "crates/scippy-metalayer",
    "crates/scippy-cli",
    "languages/python",
    "languages/typescript",
    "languages/loci",
]
default-members = [
    "crates/scippy-core",
    "crates/scippy-metalayer",
    "crates/scippy-cli",
    "languages/python",
    "languages/typescript",
    "languages/loci",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
protobuf = "3"
scip = "0.10.0"
tempfile = "3"
serde_json = "1"
regex = "1"
toml = "1"
saphyr-parser = "0.3"
caseless = "0.2"
unicode-normalization = "0.1"
unicode-general-category = "1"
percent-encoding = "2"
uuid = { version = "1", features = ["v7"] }

# The resolver engine is our fork of Stack Graphs. All four crates use one pin.
# To bump the pin, change the `rev` of the four lines below to the same commit.
stack-graphs = { git = "https://github.com/Bullish-Intelligence/stack-graphs", rev = "27e2435f8cbaa5ac30d8e6ccfdbe791c01458f1f" }
tree-sitter-stack-graphs = { git = "https://github.com/Bullish-Intelligence/stack-graphs", rev = "27e2435f8cbaa5ac30d8e6ccfdbe791c01458f1f" }
tree-sitter-stack-graphs-python = { git = "https://github.com/Bullish-Intelligence/stack-graphs", rev = "27e2435f8cbaa5ac30d8e6ccfdbe791c01458f1f" }
tree-sitter-stack-graphs-typescript = { git = "https://github.com/Bullish-Intelligence/stack-graphs", rev = "27e2435f8cbaa5ac30d8e6ccfdbe791c01458f1f" }
# Keep the same minor version as the fork.
tree-sitter = "0.24"
tree-sitter-python = "=0.23.5"
tree-sitter-typescript = "=0.23.2"

# The resolver and the grammars are slow without optimization. The tests index real projects.
[profile.dev.package."*"]
opt-level = 2
# Dependencies need no debug info. This cuts build time, link time, and disk use.
debug = false

[profile.dev]
# Keep file and line numbers in backtraces. Drop variable debug info.
debug = "line-tables-only"

# The `gate` profile builds the tests. `cargo build`, `cargo check`, and clippy keep `dev`.
# The gate profile has its own target subdir, so dev builds stay unoptimized.
[profile.gate]
# Start from the dev settings.
inherits = "dev"

# The core decodes the 13.8 MB builtins blob in each process. Unoptimized code needs 0.9 s for it.
# The other workspace crates stay at opt-level 0, so a rebuild stays fast.
[profile.gate.package.scippy-core]
opt-level = 2
