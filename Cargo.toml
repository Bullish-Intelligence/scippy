[workspace]
resolver = "3"
members = [
    "crates/scippy-core",
    "crates/scippy-cli",
    "languages/python",
    "languages/typescript",
    "languages/loci",
]
default-members = [
    "crates/scippy-core",
    "crates/scippy-cli",
    "languages/python",
    "languages/typescript",
    "languages/loci",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
protobuf = "3"
scip = "0.10.0"
tempfile = "3"
serde_json = "1"
regex = "1"
toml = "1"
saphyr-parser = "0.3"
caseless = "0.2"
unicode-normalization = "0.1"
unicode-general-category = "1"
percent-encoding = "2"

# The resolver engine is our fork of Stack Graphs. All four crates use one pin.
# To bump the pin, change the `rev` of the four lines below to the same commit.
stack-graphs = { git = "https://github.com/Bullish-Intelligence/stack-graphs", rev = "e5cba0ad1a0386f26fc5a25092afec56eb42d594" }
tree-sitter-stack-graphs = { git = "https://github.com/Bullish-Intelligence/stack-graphs", rev = "e5cba0ad1a0386f26fc5a25092afec56eb42d594" }
tree-sitter-stack-graphs-python = { git = "https://github.com/Bullish-Intelligence/stack-graphs", rev = "e5cba0ad1a0386f26fc5a25092afec56eb42d594" }
tree-sitter-stack-graphs-typescript = { git = "https://github.com/Bullish-Intelligence/stack-graphs", rev = "e5cba0ad1a0386f26fc5a25092afec56eb42d594" }
# Keep the same minor version as the fork.
tree-sitter = "0.24"
tree-sitter-python = "=0.23.5"
tree-sitter-typescript = "=0.23.2"

# The resolver and the grammars are slow without optimization. The tests index real projects.
[profile.dev.package."*"]
opt-level = 2
